name: Frontend
on:
  pull_request:
    branches: [develop, prod]
permissions:
  contents: read
concurrency:
  group: frontend-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
env:
  NEXT_TELEMETRY_DISABLED: '1'
jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_API_URL: ${{ vars.CI_API_URL }}
    steps:
      - name: Validate promotion path
        if: github.event_name == 'pull_request'
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          if [[ "$BASE_BRANCH" == prod ]]; then
            if [[ "$HEAD_BRANCH" != develop || "$HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]]; then
              echo '::error::Production PRs must originate from develop in this repository.'
              exit 1
            fi
          elif [[ "$HEAD_BRANCH" != feature/* ]]; then
            echo '::error::Develop PRs must originate from feature/*.'
            exit 1
          fi
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
